<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{TITLE}}</title><style>:root{color-scheme:dark}body{max-width:1100px;margin:auto;padding:24px;background:#0b1020;color:#edf2ff;font:16px/1.55 system-ui}section{background:#151d33;border:1px solid #31405f;border-radius:12px;padding:18px;margin:16px 0}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#090d18;padding:14px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}.card{border:1px solid #31405f;border-radius:9px;padding:12px}</style></head><body><h1 id="title">{{TITLE}}</h1><p id="summary"></p><section><h2>Primary atom</h2><pre id="primary"></pre></section><section><h2>Members</h2><div id="members" class="grid"></div></section><section><h2>Evidence graph</h2><pre id="graph"></pre></section><section><h2>Canonical JSON</h2><pre id="raw"></pre></section><script type="application/json" id="atom-data">{{ATOM_JSON}}</script><script>const d=JSON.parse(document.getElementById("atom-data").textContent);const e=v=>String(v??"").replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));document.getElementById("title").textContent=d.title;document.getElementById("summary").textContent=d.members.length+" records · "+d.evidence_graph.edges.length+" explicit edges";document.getElementById("primary").textContent=JSON.stringify(d.atom,null,2);document.getElementById("members").innerHTML=d.members.map(x=>"<article class=card><strong>"+e(x.type)+"</strong><p>"+e(x.title||x.id)+"</p></article>").join("");document.getElementById("graph").textContent=JSON.stringify(d.evidence_graph,null,2);document.getElementById("raw").textContent=JSON.stringify(d,null,2);</script></body></html>
